[project]
site_url = "https://builtbyelly.github.io/fastauth/"
site_name = "FastAuth"
site_description = "The most simple and flexible authentication library for FastAPI"
site_author = "Elliot Otoijagha"

copyright = "Copyright &copy; 2026 Elliot Otoijagha"

repo_url = "https://github.com/builtbyelly/FastAuth"
repo_name = "builtbyelly/FastAuth"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
      { "Installation" = "getting-started/installation.md" },
      { "Quickstart" = "getting-started/quickstart.md" },
    ] },
  { "Strategies" = [
      { "Session" = "strategies/session.md" },
      { "JWT" = "strategies/jwt.md" },
      { "OIDC" = "strategies/oidc.md" },
      { "OAuth2" = "strategies/oauth2.md" },
    ] },
  { "Guides" = [
      { "Adapters" = "guides/adapters.md" },
      { "Hooks" = "guides/hooks.md" },
      { "Rate Limiting" = "guides/rate-limiting.md" },
      { "Config" = "guides/config.md" },
    ] },
  { "Reference" = [
      { "API" = "reference/api.md" },
    ] },
  { "Architecture" = "ARCHITECTURE.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/builtbyelly"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/BuiltByElly"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://elliot-otoijagha.pxxl.click"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
