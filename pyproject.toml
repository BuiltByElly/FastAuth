[project]
name = "fastauth"
version = "0.1.0"
description = "The most simple and flexible auth system for FastAPI"
readme = "README.md"
authors = [
    { name = "Elly", email = "ellyeroms@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.53",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
]
