[project]
name = "builtbyelly-fastauth"
version = "0.1.0"
description = "Simple and flexible authentication library for FastAPI — FastAPI-only by design."
readme = "README.md"
authors = [
    { name = "Elliot Otoijagha", email = "eroms072020@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.10.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "uuid6>=2025.0.1",
]

[tool.uv.build-backend]
module-name = "fastauth"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "coverage>=7.10.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[bcrypt]>=0.3.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "zensical>=0.0.67",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["fastauth"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
