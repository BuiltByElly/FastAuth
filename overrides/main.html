{% extends "base.html" %}
{% block extrahead %}
  <meta property="og:title" content="{{ page.title | default(config.site_name) }}">
  <meta property="og:description" content="{{ page.description | default(config.site_description) }}">
  <meta property="og:image" content="{{ config.site_url }}assets/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.canonical_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default(config.site_name) }}">
  <meta name="twitter:description" content="{{ page.description | default(config.site_description) }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/og-image.png">
{% endblock %}
